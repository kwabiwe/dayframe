name: Unit tests, typecheck and lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per pull request: a newer push cancels the run it replaces. Pushes to main are never cancelled.
concurrency:
  group: unit-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-checks:
    name: Workspace unit tests, typecheck and lint
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "macOS", "docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Formerly its own workflow (documentation-alignment.yml); the same command, run first and whatever
      # the later steps do. `npm run lint` below runs it again as part of the lint chain.
      - name: Documentation alignment
        run: node scripts/check-docs-alignment.mjs
      - run: npm ci
        if: ${{ !cancelled() }}
      - name: Typecheck (mobile, web, shared)
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Lint (docs alignment, iOS config, web ESLint)
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Unit tests (mobile, web, shared)
        if: ${{ !cancelled() }}
        run: npm run test
